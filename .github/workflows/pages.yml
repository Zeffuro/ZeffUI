name: Build and deploy

on:
    push:
        branches: [master, typescript-migration]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Check out legacy release
              uses: actions/checkout@v7.0.1
              with:
                  ref: 0e684f30e4d7696ed0462ec54ae9287d7f9d1b7b
                  path: legacy-source
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /index.html
                      /settings.html
                      /scripts/
                      /data/
                      /skins/
                      /styles/
                      /LICENSE
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Package legacy release
              run: |
                  mkdir -p dist/legacy
                  cp -a legacy-source/index.html legacy-source/settings.html legacy-source/scripts legacy-source/data legacy-source/skins legacy-source/styles legacy-source/LICENSE dist/legacy/
                  node build-legacy.mjs
            - uses: actions/upload-pages-artifact@v5.0.0
              if: github.ref == 'refs/heads/master'
              with:
                  path: dist

    deploy:
        if: github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
